<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>植物小百科｜植物探險家</title>
<meta name="description" content="臺北市立動物園園區裡的 100 種植物：開花植物、蕨類、裸子植物，依年級看白話介紹、學名、用途和在園區哪裡看得到，還能挑兩種比一比。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css?v=1">
<link rel="stylesheet" href="/css/base.css?v=1">
<link rel="stylesheet" href="/css/site.css?v=1">
</head>
<body data-page="plants">
<main>
  <h1>📖 植物小百科</h1>
  <p class="lead">輸入名字找植物，或用下面的按鈕篩選。點一下看詳細介紹，還可以挑兩種「比一比」。頁首選「低年級」會加上注音。</p>
  <section id="cmp" hidden></section>
  <input type="search" id="q" placeholder="輸入名字或學名，例如：九芎、臺灣欒樹" aria-label="搜尋植物">
  <div class="filters" id="filters"></div>
  <p id="count" class="lead" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div id="cmpbar" class="cmpbar noprint" hidden></div>
  <dialog id="dlg"><div class="dlg-in" id="dlg-body"></div></dialog>
</main>
<script src="/js/site.js?v=1"></script>
<script src="/js/core/app.js?v=1"></script>
<script src="/js/core/layout.js?v=1"></script>
<script src="/js/core/fx.js?v=1"></script>
<script src="/js/zhuyin.js?v=1"></script>
<script src="/js/core/progress.js?v=1"></script>
<script src="/js/p-plants.js?v=1"></script>
</body>
</html>
